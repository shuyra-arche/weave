[workspace]
members = ["library", "macros"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
repository = "https://github.com/shuyra-arche/weave"
publish = false

[workspace.dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
