name: Release

on:
  push:
    tags: ['[0-9][0-9].[0-9][0-9].[0-9][0-9]-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release tag and ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(
              r"(\d{2}\.\d{2}\.\d{2})-(?:(explore|develop|preview)-([A-Z][a-z]+)|([A-Z][A-Za-z0-9]*))",
              tag,
          )
          if match is None:
              raise SystemExit(f"invalid release tag: {tag}")

          try:
              datetime.strptime(match.group(1), "%y.%m.%d")
          except ValueError as exc:
              raise SystemExit(f"invalid date in release tag: {tag}") from exc

          greek = (
              "Alpha Beta Gamma Delta Epsilon Zeta Eta Theta Iota Kappa Lambda Mu "
              "Nu Xi Omicron Pi Rho Sigma Tau Upsilon Phi Chi Psi Omega"
          ).split()
          if match.group(2) and match.group(3) not in greek:
              raise SystemExit(f"invalid Greek release suffix: {tag}")
          PY
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            exit 0
          fi
          while IFS= read -r branch; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              exit 0
            fi
          done < <(git for-each-ref --format='%(refname)' 'refs/remotes/origin/release/*')
          echo "release tag must point to main or an applicable release/<codename> branch" >&2
          exit 1

  check:
    needs: version
    uses: ./.github/workflows/check.yml

  release:
    name: Publish source release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}-(explore|develop|preview)- ]]; then
            args+=(--prerelease)
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
